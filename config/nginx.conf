# ─── Nginx Config for syncdock.tech — Clean URLs ───────────────────────────
# Place this at: /etc/nginx/sites-available/syncdock.tech
# Symlink: ln -s /etc/nginx/sites-available/syncdock.tech /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name syncdock.tech www.syncdock.tech;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name syncdock.tech www.syncdock.tech;

    root /var/www/syncdock;
    index index.html;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/syncdock.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncdock.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ─────────────────────────────────────────────────────
    include /var/www/syncdock/config/nginx-security-headers.conf;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Clean URLs ───────────────────────────────────────────────────────────
    # 1. If someone visits /page.html, redirect to /page (strip the extension)
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # 2. Serve / from index.html
    location = / {
        try_files /index.html =404;
    }

    # 3. For every other path: try exact file, then try .html, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── API Reverse Proxy -> Node.js backend on :3001 ────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket upgrade for signaling
    location /ws {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # HTML: short cache (content changes)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Assets: long cache with immutable
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Custom 404 ───────────────────────────────────────────────────────────
    error_page 404 /index.html;
}

